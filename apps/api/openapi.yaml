openapi: 3.1.0
info:
  title: Tigmi API
  version: 0.4.0
  description: |
    REST API for Tigmi. All paths are prefixed with `/api/v1`.

    **Account lifecycle.** `register` → email with a verification link
    (`{APP_URL}/verify-email#token=…`) → `verify-email` → `login`. Accounts must be verified
    before signing in. Endpoints that may send an email always answer `202 { status: "check_email" }`
    so they never reveal whether an account exists.

    **Authentication.** Send `Authorization: Bearer <accessToken>` (valid 15 minutes).
    Web clients keep the refresh token in the HttpOnly cookie `tigmi_rt` (path `/api/v1/auth`) and
    must echo the `tigmi_csrf` cookie in the `X-CSRF-Token` header when calling `/auth/refresh`.
    Mobile clients send `X-Client-Type: mobile` on login and receive the refresh token
    in the body instead.

    **Errors** always look like `{ "error": { "code", "message", "details"?, "requestId" } }`.
servers:
  - url: /api/v1

tags:
  - name: System
  - name: Auth
  - name: Households
    description: |
      Every household route checks, in the database, that the caller is a member and that their
      role grants the required permission. Non-members get `404 HOUSEHOLD_NOT_FOUND`, never `403`.

paths:
  /health:
    get:
      tags: [System]
      summary: API and database status
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: API up, database unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account (sends a verification email)
      description: |
        Rate limited (5 per hour per IP). Same answer for new and already-registered emails:
        a new email receives a verification link, an existing one receives an
        "you already have an account" notice. Does not sign in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202': { $ref: '#/components/responses/CheckEmail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Confirm an email address with the token from the email link
      description: Rate limited (20 per 15 minutes per IP). Tokens expire after 24 hours and work once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '204': { description: Email verified }
        '400': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new verification link (unverified accounts only)
      description: At most one email per account per minute; 5 requests per hour per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/CheckEmail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      description: Same answer for unknown emails. At most one email per account per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202': { $ref: '#/components/responses/CheckEmail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password with the token from the reset email
      description: |
        Token expires after 1 hour and works once (only the most recent link is valid).
        Signs out every device, verifies the email, lifts any lockout, and emails a
        "password changed" notice. A rejected password does not use up the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, pattern: '^[\w-]{43}$' }
                password: { type: string, minLength: 12, maxLength: 128 }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/InvalidToken' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and start a session (one session per device)
      description: |
        Rate limited (10 per 15 minutes per IP). After 5 consecutive wrong passwords the account
        is locked for 15 minutes (`ACCOUNT_LOCKED`, with `Retry-After`).
      parameters: [{ $ref: '#/components/parameters/ClientType' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: '`INVALID_CREDENTIALS` (same answer for unknown email and wrong password)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`EMAIL_NOT_VERIFIED` (only returned when the password is correct)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for new tokens (rotation)
      description: |
        Every refresh token works once. Re-using an already rotated token (more than 10 seconds
        after rotation) revokes the whole session. Web: cookie + `X-CSRF-Token` header.
        Mobile: `refreshToken` in the body.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required for cookie-based (web) refresh; value of the `tigmi_csrf` cookie.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                refreshToken: { type: string, description: Mobile clients only }
      responses:
        '200':
          description: New access token (and rotated refresh token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: '`INVALID_REFRESH_TOKEN` (missing, unknown, expired, revoked or reused)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`CSRF_TOKEN_INVALID`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`REFRESH_IN_PROGRESS` — another tab just refreshed; retry once'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out the current device
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Session revoked, cookies cleared }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /households:
    post:
      tags: [Households]
      summary: Create a household (the creator becomes OWNER)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHouseholdRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    get:
      tags: [Households]
      summary: Households the current user belongs to
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: List (oldest membership first)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      households:
                        type: array
                        items: { $ref: '#/components/schemas/Household' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /households/{householdId}:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      tags: [Households]
      summary: Household details (permission `household:read`)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: The household with `myRole` and `permissions`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdResponse' }
        '404': { $ref: '#/components/responses/HouseholdNotFound' }
    patch:
      tags: [Households]
      summary: Update settings (permission `household:update` — OWNER)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHouseholdRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HouseholdResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/HouseholdNotFound' }
    delete:
      tags: [Households]
      summary: Delete the household and all its data (permission `household:delete` — OWNER)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmName]
              properties:
                confirmName: { type: string, description: Must equal the household name exactly }
      responses:
        '204': { description: Deleted (audit trail is kept) }
        '400':
          description: '`CONFIRMATION_MISMATCH` or `VALIDATION_ERROR`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/HouseholdNotFound' }

  /households/{householdId}/members:
    parameters: [{ $ref: '#/components/parameters/HouseholdId' }]
    get:
      tags: [Households]
      summary: Members, owners first (permission `members:read`)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/HouseholdNotFound' }

  /households/{householdId}/members/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/HouseholdId' }
      - name: memberId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Households]
      summary: Change a member's role
      description: |
        Permission `members:manage`. Owners may assign any role (several owners are allowed).
        Others may only manage members ranked below them and only assign lower roles
        (an ADMIN can manage MEMBERs but cannot create admins). The last OWNER cannot be demoted.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      member: { $ref: '#/components/schemas/Member' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`HOUSEHOLD_NOT_FOUND` or `MEMBER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/LastOwner' }
    delete:
      tags: [Households]
      summary: Remove a member, or leave (when memberId is your own membership)
      description: Leaving is open to every role; removing others follows the same hierarchy as role changes.
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: '`HOUSEHOLD_NOT_FOUND` or `MEMBER_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409': { $ref: '#/components/responses/LastOwner' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  parameters:
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClientType:
      name: X-Client-Type
      in: header
      required: false
      description: '`mobile` → refresh token returned in the body, no cookies.'
      schema: { type: string, enum: [mobile] }

  responses:
    HouseholdNotFound:
      description: '`HOUSEHOLD_NOT_FOUND` — also returned when you are not a member'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: '`FORBIDDEN` — you are a member but your role does not allow this'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    LastOwner:
      description: '`LAST_OWNER` — a household must keep at least one owner'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CheckEmail:
      description: Accepted. Identical whether or not an email was actually sent.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  status: { type: string, const: check_email }
    InvalidToken:
      description: '`INVALID_OR_EXPIRED_TOKEN`, or `VALIDATION_ERROR` for a malformed token/password'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: '`VALIDATION_ERROR` with `details: [{ field, code }]`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: '`UNAUTHENTICATED`, `INVALID_ACCESS_TOKEN` or `SESSION_REVOKED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: '`RATE_LIMITED` or `ACCOUNT_LOCKED`; see `Retry-After` header'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status: { type: string, enum: [ok, degraded] }
            database: { type: string, enum: [up, down] }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [fullName, email, password]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        preferredLanguage: { type: string, enum: [fr, ar], default: fr }

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, pattern: '^[\w-]{43}$' }

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, maxLength: 128 }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        avatarUrl: { type: [string, 'null'] }
        preferredLanguage: { type: string, enum: [fr, ar] }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }

    AuthResponse:
      type: object
      properties:
        data:
          type: object
          required: [user, accessToken, accessTokenExpiresAt]
          properties:
            user: { $ref: '#/components/schemas/User' }
            accessToken: { type: string }
            accessTokenExpiresAt: { type: string, format: date-time }
            csrfToken: { type: string, description: Web clients only }
            refreshToken: { type: string, description: Mobile clients only }
            sessionExpiresAt: { type: string, format: date-time, description: Mobile clients only }

    CreateHouseholdRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500 }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: MAD, description: ISO 4217 }
        timezone: { type: string, default: Africa/Casablanca, description: IANA time zone }

    UpdateHouseholdRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 500, description: Empty string clears it }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        timezone: { type: string }

    Household:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        currency: { type: string }
        timezone: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        myRole: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        permissions: { type: array, items: { type: string }, description: What the caller may do }
        memberCount: { type: integer }

    HouseholdResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            household: { $ref: '#/components/schemas/Household' }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid, description: Membership id (use it in member routes) }
        role: { type: string, enum: [OWNER, ADMIN, MEMBER] }
        joinedAt: { type: string, format: date-time }
        user:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string, format: email }
            avatarUrl: { type: [string, 'null'] }

    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
            requestId: { type: string }
