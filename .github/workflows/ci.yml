# Runs the same checks as `npm run check` + E2E on every push and pull request.
# Actions are pinned to full commit SHAs (supply-chain safety); the comment shows the version.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.11-alpine3.23
        env:
          POSTGRES_USER: tigmi
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: tigmi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tigmi -d tigmi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 1025:1025
          - 8025:8025

    env:
      # Email goes to the Mailpit service above (tests read it back through its API).
      APP_URL: http://localhost:5180
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      MAIL_FROM: Tigmi <no-reply@tigmi.local>
      # CI-only throwaway credentials for the disposable service container above.
      TEST_DATABASE_URL: postgresql://tigmi:ci-only-password@localhost:5432/tigmi_test
      DATABASE_URL: postgresql://tigmi:ci-only-password@localhost:5432/tigmi_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Generate a throwaway JWT secret for this run
        run: echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48 | tr -d '\n=' | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Apply migrations
        run: npm run db:deploy

      - name: Unit + integration tests
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Production bundle must not contain development React
        run: '! grep -l jsxDEV apps/web/dist/assets/*.js'

      - name: Dependency audit (production)
        run: npm run audit

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
